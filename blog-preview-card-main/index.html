<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>

<div class="wrapper">
  <div class="card">

    <!-- div1 imagem -->
    <div class="card-image">
      <img src="./assets/images/illustration-article.svg" alt="Illustration of the article">
    </div>
    <!-- div1 imagem -->

    <!-- div2 conteudo -->
    <div class="card-content">
      
      <div class="category">
        Learning
      </div>
      
      <div class="publish-date">
        Published 21 Dec 2023
      </div>
      
        <h3 class="title">HTML & CSS foundations</h3>
      
      <div class="description">
        <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
    </div>
    <!-- div2 conteudo -->
      
    <!-- div3 autor -->
    <div class="author">
      <div class="author-img">
        <img src="./assets/images/image-avatar.webp" alt="Greg Hooper">
      </div>
      <div class="author-name">
        <h4>Greg Hooper</h4>
      </div>
    </div>
    <!-- div3 autor -->
      
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Gabriel Lima</a>.
  </div>
</div>
</body>
</html>
